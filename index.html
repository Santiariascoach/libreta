<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Libreta">
<meta name="theme-color" content="#0E1012">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Libreta de Hierro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna tipo app móvil (máx. 560px), tarjeta por ejercicio, barra de pestañas fija abajo. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F4F5F7; --ink:#14171B; --muted:#5B6470; --line:#D6DAE0;
  --accent:#F5B700; --accent-ink:#1A1400; --accent-soft:#FFF1C2;
  --up:#13784A; --up-soft:#DCF2E5; --down:#BF3826; --down-soft:#FBE2DD; --info:#2A5FC4; --info-soft:#E1E9FA; --hold-soft:#E7EAEE;
  --p25:#D2362B; --p20:#2860C8; --p15:#E9B400; --p10:#2E9A4E; --p5:#F4F4F2; --p2:#2A2D31; --p1:#AEB5BD;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1012; --surface:#171A1E; --surface-2:#1F2328; --ink:#EEF1F4; --muted:#98A1AB; --line:#2B3037;
  --accent:#FFC21A; --accent-ink:#1A1400; --accent-soft:#3A2F0A;
  --up:#45CF84; --up-soft:#11301F; --down:#FF6E58; --down-soft:#3A1A15; --info:#78A6FF; --info-soft:#172645; --hold-soft:#252A30;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1012; --surface:#171A1E; --surface-2:#1F2328; --ink:#EEF1F4; --muted:#98A1AB; --line:#2B3037;
  --accent:#FFC21A; --accent-ink:#1A1400; --accent-soft:#3A2F0A;
  --up:#45CF84; --up-soft:#11301F; --down:#FF6E58; --down-soft:#3A1A15; --info:#78A6FF; --info-soft:#172645; --hold-soft:#252A30;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}
.wrap{padding-top:calc(18px + env(safe-area-inset-top,0px))!important}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 150px;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.brand b i{font-style:normal;color:var(--accent)}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:40px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:20px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{background:var(--surface);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:16px solid var(--accent);opacity:.16}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.meta strong{color:var(--ink);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.banner.info{background:var(--info-soft);color:var(--ink)}
.banner.warn{background:var(--accent-soft)}
.banner button{background:none;border:0;font-weight:700;text-decoration:underline;padding:0}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-name{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.1}
.rx{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;letter-spacing:.01em}
.rx small{font-size:17px;font-weight:600;color:var(--muted);margin-left:3px}
.pill{flex:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:4px 8px;white-space:nowrap}
.pill.up{background:var(--up-soft);color:var(--up)}
.pill.down{background:var(--down-soft);color:var(--down)}
.pill.reps{background:var(--info-soft);color:var(--info)}
.pill.hold,.pill.start{background:var(--hold-soft);color:var(--muted)}
.pill.new{background:var(--accent-soft);color:var(--ink)}
.pill.test{background:var(--accent);color:var(--accent-ink)}
.pill.deload,.pill.suave{background:var(--info-soft);color:var(--info)}
.head-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.swapbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600;color:var(--muted)}
.swapbox{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:12px;padding:10px}
.swapbox .chip{background:var(--surface)}
.swapbox .chip.keep{align-self:flex-start;font-size:13px}
.swapbox .chip.keep[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:2px}
.wd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:9px;background:var(--surface-2);border:1.5px solid transparent;min-width:0}
.wd span{font-size:11px;font-weight:600;color:var(--muted)}
.wd b{font-family:var(--f-display);font-size:17px;font-weight:800;line-height:1.1}
.wd i{font-style:normal;font-size:9px;color:var(--muted);height:11px;line-height:11px}
.wd.gym{background:var(--accent-soft)}
.wd.opt{background:var(--surface-2);border-style:dashed;border-color:var(--line)}
.wd.today{border-color:var(--ink)}
.wkrow{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.wkrow .chips{gap:6px}
.wkrow .chip{padding:5px 10px;font-size:13px}
.wkrow .chip.descanso[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);border-color:var(--ink)}
.wplan{display:grid;grid-template-columns:86px 1fr;gap:4px 8px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.wplan b{font-weight:600}
.wplan .n{grid-column:2;font-size:12px;color:var(--muted)}
.reason{font-size:14px;color:var(--muted)}
.warm{font-size:13px;color:var(--muted)}
.plates{display:flex;align-items:center;gap:2px;height:46px}
.plates .bar{width:34px;height:6px;border-radius:2px;background:var(--p1)}
.plates .collar{width:6px;height:16px;border-radius:2px;background:var(--p1);margin-right:2px}
.plate{width:9px;border-radius:2px;border:1px solid var(--line)}
.plates-lbl{font-size:12px;color:var(--muted);margin-left:8px}
.wrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wrow label{font-size:13px;color:var(--muted);min-width:44px}
.step{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;font-weight:600;display:grid;place-items:center;line-height:1}
.winput{width:88px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:10px;padding:6px 6px 6px 10px;border-radius:12px;background:var(--surface-2)}
.set.done{background:var(--up-soft)}
.set .lbl{font-size:13px;color:var(--muted);font-weight:600}
.set .lbl b{display:block;color:var(--ink);font-size:12px;font-weight:500}
.repctl{display:flex;align-items:center;gap:6px;justify-content:center}
.repctl .val{min-width:40px;text-align:center;font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.check{width:48px;height:42px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:800;display:grid;place-items:center}
.set.done .check{background:var(--up);border-color:var(--up);color:var(--surface)}
.effort{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.effort span{font-size:13px;color:var(--muted);margin-right:2px}
.effort .chip{padding:6px 11px;font-size:13px}
.btn{border:0;border-radius:12px;padding:15px 18px;font-weight:700;font-size:16px;letter-spacing:.02em}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:var(--down);color:var(--surface)}
.btn.block{width:100%}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:6px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt b{font-family:var(--f-display);font-size:20px;font-weight:700}
.opt span{font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;font-weight:600;color:var(--muted)}
.tinput{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .v{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .v small{font-size:16px;color:var(--muted);font-weight:600}
.tile .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.gain{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.gain:last-child{border-bottom:0}
.gain .pos{color:var(--up);font-weight:700}
.gain .neg{color:var(--down);font-weight:700}
.hist{display:flex;flex-direction:column;gap:4px}
.hist-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:none;border:0;padding:0;text-align:left;width:100%}
.hist-line{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.hist-line span:last-child{color:var(--muted);text-align:right}
.ex-row{display:grid;grid-template-columns:1fr 84px 70px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ex-row .tinput{height:38px;font-size:15px;text-align:center;padding:0 6px}
.ex-row .nm{font-size:14px;font-weight:600;min-width:0}
.ex-row .nm span{display:block;font-weight:400;color:var(--muted);font-size:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
#timer{position:fixed;left:0;right:0;z-index:19;bottom:calc(62px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#timer .in{max-width:560px;margin:0 auto 8px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
#timer .t{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:70px}
#timer .lab{flex:1;font-size:13px;opacity:.8}
#timer button{background:none;border:1px solid currentColor;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;color:inherit}
#timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#modal .sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.chg{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.chg .nm{font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;text-align:center}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.brand-r{display:flex;align-items:center;gap:8px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
#mic{position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
#timer:not([hidden]) ~ #mic{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
#mic .mbtn{pointer-events:auto;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.28)}
#mic .mbtn svg{width:26px;height:26px}
#mic.on .mbtn{background:var(--down);color:var(--surface)}
#mic .bubble{pointer-events:auto;max-width:240px;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 12px;font-size:13px}
@media (prefers-reduced-motion:no-preference){#mic.on .mbtn{animation:pulse 1.4s ease-out infinite}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--down) 55%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a.wait{color:var(--muted)}
.ask{display:flex;gap:8px;position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px}
.ask .tinput{flex:1;min-width:0}
.ask .btn{padding:0 16px}
.qchips{display:flex;flex-wrap:wrap;gap:8px}
/* modo entreno */
#focus{position:fixed;inset:0;z-index:25;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
body.focusing{overflow:hidden}
body.focusing #timer{display:none}
body.focusing #mic{z-index:27;bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.f-top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:560px;width:100%;margin:0 auto}
.f-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;max-width:560px;width:100%;margin:0 auto}
.f-name{font-family:var(--f-display);font-size:clamp(28px,8vw,40px);font-weight:800;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.f-sets{font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.f-big{font-family:var(--f-display);font-weight:800;font-size:clamp(76px,24vw,150px);line-height:.95;font-variant-numeric:tabular-nums;color:var(--ink)}
.f-big small{font-size:.38em;color:var(--muted);font-weight:700;margin:0 .12em}
.f-rest .f-big{color:var(--accent)}
.f-next{font-size:16px;color:var(--muted)}
.f-adj{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.f-adj .grp{display:flex;align-items:center;gap:8px}
.f-adj .grp span{font-size:12px;color:var(--muted);font-weight:600;min-width:34px}
.f-done{width:100%;max-width:420px;height:88px;border:0;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:32px;font-weight:800;letter-spacing:.04em}
.f-nav{display:flex;gap:10px;max-width:560px;width:100%;margin:0 auto}
.f-nav .btn{flex:1}
.f-nav .btn:disabled{opacity:.35}
.f-open{display:flex;align-items:center;justify-content:center;gap:8px}
.pv{gap:0}
.pv .ex-head{margin-bottom:8px}
.pv-row,.act-row{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;color:var(--ink)}
.pv-row:first-of-type{border-top:0}
.pv-n,.act-ic{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.pv-main{display:flex;flex-direction:column;min-width:0}

.rg-wrap{display:grid;grid-template-columns:minmax(0,170px) 1fr;gap:14px;align-items:center}
.rings{width:100%;height:auto}

.lv{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}

.lv-top em{font-style:normal;color:var(--up);font-weight:700;font-size:13px}

#modal.full{align-items:stretch;padding:0;background:var(--bg)}
.done-wrap{position:relative;width:100%;height:100%;overflow-y:auto;background:radial-gradient(90% 50% at 50% 0%,rgba(255,194,26,.22),transparent 70%),var(--bg);color:var(--ink)}
.done-in{position:relative;z-index:1;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 28px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(18px,env(safe-area-inset-left,0px))}

@media (prefers-reduced-motion:no-preference){
  .anim .ring{animation:ringIn 1.4s cubic-bezier(.2,.8,.2,1) both}

  .anim .area{animation:fadeIn 1s .5s both}
  .anim .prdot{animation:pop .5s 1.2s both;transform-box:fill-box;transform-origin:center}

  .anim .ac-at em,.anim .lv-bar i,.anim .mbar i,.anim .ach .pbar i{animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}

  .anim .trophy,.anim .ach{animation:rise .5s both}
  .done-wrap .done-in>*{animation:rise .5s both}
  .done-wrap .done-in>*:nth-child(2){animation-delay:.08s}.done-wrap .done-in>*:nth-child(3){animation-delay:.16s}.done-wrap .done-in>*:nth-child(4){animation-delay:.24s}.done-wrap .done-in>*:nth-child(5){animation-delay:.32s}
  .done-prs::after{content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:rotate(18deg);animation:shine 2.2s .6s ease-out infinite}
  .confetti i{animation:fall linear both}
}

.ph-row{display:flex;align-items:center;gap:14px}

@keyframes ringIn{from{stroke-dashoffset:100}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@keyframes grow{from{width:0}}

@keyframes shine{from{left:-60%}to{left:130%}}

/* Gestión de la carga */
.well .ex-head{align-items:center}
.wcount{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--muted)}
.wq{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}

.wb.w1[aria-pressed="true"]{background:#D2362B}.wb.w2[aria-pressed="true"]{background:#F08A24}.wb.w3[aria-pressed="true"]{background:#E9B400;color:#1A1400}.wb.w4[aria-pressed="true"]{background:#7DB83A}.wb.w5[aria-pressed="true"]{background:#2E9A4E}

function progress(e,done){

  const isBW=LIB[e.id].equip==="peso";

    e.weight=roundW(e,w+step);e.fails=0;e.targets=Array(e.sets).fill(min);e.status="up";

  }else{
    e.fails=0;
    const bump=rpe!=null?(rpe<=7?2:rpe<=9?1:0):1;

function freshDraft(dayIdx,ready){
  const d=dayIdx==null?defaultDay():dayIdx;
  const dr={day:d,started:Date.now(),date:new Date().toDateString(),items:{},swaps:{},ready:ready||null,rev:S.rev||0};
  const lv=readyLevel(dr);
  S.program[d].ex.forEach(id=>{dr.items[id]=itemFor(id,lv);});
  return dr;
}
const draftTouched=dr=>Object.values(dr.items).some(it=>it.done.some(Boolean));
function ensureDraft(){
  if(draft&&!draftTouched(draft)&&(draft.date!==new Date().toDateString()||(draft.rev||0)!==(S.rev||0)))draft=null;
  if(!draft){draft=freshDraft();saveDraft();}
}
function applyReady(){
  const lv=readyLevel(draft);
  dayList(draft).forEach(id=>{const it=draft.items[id];if(!it.done.some(Boolean))draft.items[id]=itemFor(id,lv);});
}
function doSwap(cur,nw,keep){
  const day=S.program[draft.day],list=dayList(draft);
  if(list.includes(nw)){toast(LIB[nw].name+" ya está en la sesión de hoy.");return;}
  ensureEx(nw);
  const orig=day.ex.find(id=>((draft.swaps&&draft.swaps[id])||id)===cur);
  draft.swaps=draft.swaps||{};
  if(keep){day.ex[day.ex.indexOf(orig)]=nw;delete draft.swaps[orig];saveProfile();}
  else if(orig===nw)delete draft.swaps[orig];
  else draft.swaps[orig]=nw;
  delete draft.items[cur];draft.items[nw]=itemFor(nw,readyLevel(draft));
  swapOpen=null;saveDraft();
  toast(keep?"Cambiado en tu rutina: "+LIB[nw].name:"Solo hoy: "+LIB[nw].name);
}

  const ws=weekStartMs(),done={},plan={};MUSCLES.forEach(([k])=>{done[k]=0;plan[k]=0;});

}

function goalEstimate(g){
  const pts=[];SESS.forEach(s=>s.entries.forEach(e=>{if(e.id===g.ex&&e.e1rm)pts.push([new Date(s.date).getTime()/864e5,e.e1rm]);}));
  const best=pts.reduce((b,p)=>Math.max(b,p[1]),0),first=pts.length?pts[0][1]:0;
  if(best&&best>=g.target)return{best,first,done:true};
  if(pts.length<3)return{best,first,msg:"Necesito al menos 3 sesiones de este ejercicio para calcular tu ritmo."};
  const lastDay=pts[pts.length-1][0],rec=pts.filter(p=>p[0]>=lastDay-56),use=rec.length>=3?rec:pts;
  const n=use.length,mx=use.reduce((a,p)=>a+p[0],0)/n,my=use.reduce((a,p)=>a+p[1],0)/n;
  let num=0,den=0;use.forEach(p=>{num+=(p[0]-mx)*(p[1]-my);den+=(p[0]-mx)**2;});
  const slope=den?num/den:0;
  if(slope<=0.01)return{best,first,msg:"Ahora mismo estás estancado y con este ritmo no hay fecha. Pregúntale al coach qué cambiar."};
  const fit=my+slope*(lastDay-mx),from=Math.max(best,fit),days=(g.target-from)/slope;
  if(days>730)return{best,first,rate:slope*7,msg:"A este ritmo (+"+fmt(Math.round(slope*7*10)/10)+" kg/semana) tardarías más de 2 años. Prueba con una meta intermedia."};
  const d=new Date(Date.now()+Math.max(0,days)*864e5);
  return{best,first,rate:slope*7,date:d,weeks:Math.max(1,Math.ceil(days/7))};
}

const NUMW={cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,dieciséis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuno:21,veintidos:22,veintidós:22,veinticinco:25,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100};
function wordsToNums(t){
  const tk=t.split(/\s+/),out=[];
  for(let i=0;i<tk.length;i++){
    const w=tk[i];
    if(NUMW[w]!=null){
      let v=NUMW[w];
      if(v===100&&NUMW[tk[i+1]]!=null&&NUMW[tk[i+1]]<100){v+=NUMW[tk[i+1]];i++;if(tk[i+1]==="y"&&NUMW[tk[i+2]]!=null&&NUMW[tk[i+2]]<10){v+=NUMW[tk[i+2]];i+=2;}}
      else if(v>=30&&v<100&&tk[i+1]==="y"&&NUMW[tk[i+2]]!=null&&NUMW[tk[i+2]]<10){v+=NUMW[tk[i+2]];i+=2;}
      out.push(String(v));
    }else if(w==="medio"&&out.length&&out[out.length-1]==="y"&&/^\d/.test(out[out.length-2]||"")){out.pop();out[out.length-1]=String(Number(out[out.length-1])+0.5);}
    else out.push(w);
  }
  return out.join(" ");
}
function parseVoice(raw){
  let t=raw.toLowerCase().normalize("NFC").replace(/(\d),(\d)/g,"$1.$2").replace(/[¿?¡!.,;:]+(?=\s|$)/g," ");
  t=wordsToNums(t.trim());
  t=t.replace(/(\d+(?:\.\d+)?) y medio/g,(m,a)=>String(Number(a)+0.5));
  let w=null,r=null,m;
  if((m=t.match(/(?:con|a)\s+(\d+(?:\.\d+)?)/))||(m=t.match(/(\d+(?:\.\d+)?)\s*(?:kilos?|kg|quilos?)/)))w=Number(m[1]);
  if((m=t.match(/(\d+)\s*(?:reps?|repes?|repeticion(?:es)?)/)))r=Number(m[1]);
  if(r==null){const nums=(t.match(/\d+(?:\.\d+)?/g)||[]).map(Number);const rest=w==null?nums:nums.filter((n,i)=>!(n===w&&i===nums.indexOf(w)));if(rest.length)r=rest[0];}
  return{r,w,t};
}
function voiceLog(text){

}

function weekStats(ws){

  const gains=[];const seen={};
  ss.forEach(s=>s.entries.forEach(e=>{if(!e.e1rm||seen[e.id])return;let before=0,now=0;SESS.forEach(x=>{const t=new Date(x.date).getTime();x.entries.forEach(y=>{if(y.id!==e.id||!y.e1rm)return;if(t<ws)before=Math.max(before,y.e1rm);else if(t<we)now=Math.max(now,y.e1rm);});});seen[e.id]=1;if(before&&now)gains.push({id:e.id,name:e.name,d:now-before,pct:(now-before)/before*100});}));

}

function lineChart(points,opts){
  if(points.length<2)return '<p class="small muted">Necesitas al menos dos sesiones de este ejercicio para ver la curva.</p>';
  const W=340,H=200,pl=38,pr=44,pt=16,pb=26;
  const all=[];opts.series.forEach(s=>points.forEach(p=>{if(p[s.key]!=null)all.push(p[s.key]);}));
  let lo=Math.min(...all),hi=Math.max(...all);if(hi===lo){hi+=5;lo-=5;}
  const span=hi-lo,raw=span/3,mag=Math.pow(10,Math.floor(Math.log10(raw))),stepT=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||raw;
  lo=Math.floor(lo/stepT)*stepT;hi=Math.ceil(hi/stepT)*stepT;
  const x=i=>pl+(W-pl-pr)*i/(points.length-1),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const gid="lg"+(gradN++),fid="gl"+(gradN++);
  let g='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.42"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient><filter id="'+fid+'" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>';
  for(let v=lo;v<=hi+1e-9;v+=stepT){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/><text x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+fmt(v)+"</text>";}
  g+='<text x="'+pl+'" y="'+(H-6)+'" font-size="11" fill="var(--muted)">'+fshort(points[0].date)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" font-size="11" text-anchor="end" fill="var(--muted)">'+fshort(points[points.length-1].date)+"</text>";
  opts.series.slice().reverse().forEach(s=>{
    const si=opts.series.indexOf(s);
    const pts=points.map((p,i)=>p[s.key]==null?null:[x(i),y(p[s.key]),p]).filter(Boolean);if(pts.length<1)return;
    const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
    if(si===0){
      g+='<path class="area" d="'+d+" L"+pts[pts.length-1][0].toFixed(1)+" "+(H-pb)+" L"+pts[0][0].toFixed(1)+" "+(H-pb)+' Z" fill="url(#'+gid+')"/>';
      g+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="6" opacity=".35" filter="url(#'+fid+')"/>';
      g+='<path class="draw" pathLength="1" d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
      pts.forEach(p=>{if(p[2].pr)g+='<circle class="prdot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="5" fill="#FFE38A" stroke="#B8860B" stroke-width="1.5"/>';});
      const lp=pts[pts.length-1];
      g+='<circle cx="'+lp[0]+'" cy="'+lp[1]+'" r="9" fill="var(--accent)" opacity=".25"/><circle cx="'+lp[0]+'" cy="'+lp[1]+'" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
      g+='<text x="'+(lp[0]+10)+'" y="'+(lp[1]+4)+'" font-size="13" font-weight="800" font-family="Barlow Condensed,Arial Narrow,sans-serif" fill="var(--ink)">'+fmt(lp[2][s.key])+"</text>";
    }else g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="1.6"'+(s.dash?' stroke-dasharray="4 4"':"")+' stroke-linejoin="round" stroke-linecap="round"/>';
  });
  return '<div class="chart"><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(opts.label)+'">'+g+'</svg></div><div class="legend">'+opts.series.map(s=>'<span><i style="background:'+s.color+'"></i>'+s.name+"</span>").join("")+(points.some(p=>p.pr)?'<span><i class="lg-pr"></i>Récord</span>':"")+"</div>";
}

function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,0.22].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(0.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(0.25,actx.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+t+0.18);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+0.2);});}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,80,200]);}catch(e){}}
function startRest(sec,label){timer.end=Date.now()+sec*1000;timer.total=sec*1000;timer.label=label;clearInterval(timer.iv);timer.iv=setInterval(tick,250);tick();}
function tick(){setTimeout(tickFocus,0);
  const el=$("#timer"),left=timer.end-Date.now();
  if(left<=0){clearInterval(timer.iv);beep();el.innerHTML='<div class="in"><span class="t">0:00</span><span class="lab">A por la siguiente serie</span><button data-act="t-skip">Cerrar</button></div>';el.hidden=false;setTimeout(()=>{if(Date.now()>=timer.end)el.hidden=true;},4000);return;}
  const s=Math.ceil(left/1000);
  el.hidden=false;
  el.innerHTML='<div class="in"><span class="t">'+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+'</span><span class="lab">Descanso · '+esc(timer.label)+'</span><button data-act="t-add">+30 s</button><button data-act="t-skip">Saltar</button><span class="bar" style="width:'+(100*(1-left/timer.total)).toFixed(1)+'%'+(s<=10?";background:var(--up)":"")+'"></span></div>';
}
function restFor(id){if(LIB[id].kind==="acc")return 90;return S.settings.goal==="fuerza"?180:150;}

  const ch=res.changes.slice().sort((a,b)=>(order[a.status]??9)-(order[b.status]??9));
  const ups=ch.filter(c=>c.status==="up").length,prs=s.entries.filter(e=>e.pr),sets=s.entries.reduce((a,e)=>a+e.reps.filter(r=>r>0).length,0);

  (res.delta!=null?'<div class="delta '+(res.delta>=0?"pos":"neg")+'">'+(res.delta>=0?"▲ +":"▼ ")+res.delta+" % de volumen respecto a tu última "+esc(s.day)+"</div>":"")+
  (prs.length?'<div class="done-prs"><span class="eyebrow gold">'+(prs.length===1?"Nuevo récord":prs.length+" récords nuevos")+"</span>"+prs.map(e=>'<div class="dp">'+medalSVG(abbr(e.name))+'<div><b>'+esc(e.name)+'</b><span class="num">1RM estimado: <strong>'+fmt(e.e1rm)+" kg</strong></span></div></div>").join("")+"</div>":"")+

  (res.block?'<div class="banner warn"><span><strong>¡Bloque '+(res.block.block-1)+' terminado!</strong> Empieza el bloque '+res.block.block+" de "+SCHEMES[res.block.phase].label.toLowerCase()+": nuevos rangos de reps y pesos recalculados con tu test.</span></div>":"")+

  (prs.length?'<button class="btn ghost block" data-act="story" data-v="'+prs[0].id+'">Imagen del récord de '+esc(prs[0].name)+"</button>":"")+
  '<button class="btn ghost block" data-act="close-modal">Ver la próxima sesión</button></div></div>';
  m.hidden=false;m.scrollTop=0;runCounters();
}

let storyBlob=null,storyId=null,downloader=null;
async function initDownloads(){try{if(window.claude&&window.claude.use)downloader=await window.claude.use("downloads");}catch(e){downloader=null;}}
function storyData(id){
  const pts=[];SESS.forEach(s=>s.entries.forEach(e=>{if(e.id===id&&e.e1rm)pts.push({d:s.date,v:e.e1rm,w:e.w,reps:e.reps,pr:e.pr});}));
  if(pts.length<2)return null;
  const first=pts[0],best=pts.reduce((b,p)=>p.v>b.v?p:b,pts[0]),weeks=Math.max(1,Math.round((new Date(best.d)-new Date(first.d))/(7*864e5)));
  const last=pts[pts.length-1];
  if(best.v<=first.v)return null;
  return{pts,first,best,weeks,isPR:!!last.pr,last};
}
async function drawStory(id){
  const D=storyData(id);if(!D)return null;
  try{await document.fonts.load('800 100px "Barlow Condensed"');await document.fonts.load('600 40px "Barlow"');}catch(e){}
  const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const Y="#FFC21A",BG="#0E1012",INK="#EEF1F4",MUT="#98A1AB",LINE="#2B3037";
  g.fillStyle=BG;g.fillRect(0,0,W,H);
  g.strokeStyle=Y;g.globalAlpha=.14;g.lineWidth=60;g.beginPath();g.arc(W-60,250,260,0,Math.PI*2);g.stroke();g.globalAlpha=1;
  const DF='"Barlow Condensed","Arial Narrow",sans-serif',BF='"Barlow",system-ui,sans-serif';
  g.fillStyle=Y;g.font="800 54px "+DF;g.fillText(D.isPR?"NUEVO RÉCORD":"PROGRESO",90,230);
  g.fillStyle=INK;g.font="800 128px "+DF;

  words.forEach(w=>{const t=line?line+" "+w:w;if(g.measureText(t).width>W-180){lines.push(line);line=w;}else line=t;});lines.push(line);
  lines.slice(0,3).forEach(l=>{g.fillText(l,90,y);y+=125;});
  y+=40;g.fillStyle=MUT;g.font="600 40px "+BF;g.fillText("1RM estimado",90,y);
  y+=170;g.font="800 210px "+DF;g.fillStyle=MUT;const a=fmt(D.first.v);g.fillText(a,90,y);
  let x=90+g.measureText(a).width+30;g.fillStyle=Y;g.font="800 150px "+DF;g.fillText("→",x,y-20);x+=g.measureText("→").width+30;
  g.fillStyle=INK;g.font="800 210px "+DF;g.fillText(fmt(D.best.v),x,y);x+=g.measureText(fmt(D.best.v)).width+14;g.font="700 80px "+DF;g.fillStyle=MUT;g.fillText("kg",x,y);
  y+=90;g.fillStyle=Y;g.font="700 64px "+DF;const diff=D.best.v-D.first.v;g.fillText("+"+fmt(Math.round(diff*10)/10)+" KG EN "+D.weeks+" SEMANA"+(D.weeks===1?"":"S"),90,y);
  // gráfica
  const cx=90,cy=y+110,cw=W-180,ch=560,vs=D.pts.map(p=>p.v),lo=Math.min(...vs)-2,hi=Math.max(...vs)+2;
  const px=i=>cx+cw*i/(D.pts.length-1),py=v=>cy+ch*(1-(v-lo)/(hi-lo));
  g.strokeStyle=LINE;g.lineWidth=2;for(let k=0;k<=3;k++){const yy=cy+ch*k/3;g.beginPath();g.moveTo(cx,yy);g.lineTo(cx+cw,yy);g.stroke();}
  g.beginPath();D.pts.forEach((p,i)=>{i?g.lineTo(px(i),py(p.v)):g.moveTo(px(i),py(p.v));});
  g.lineTo(px(D.pts.length-1),cy+ch);g.lineTo(px(0),cy+ch);g.closePath();g.fillStyle="rgba(255,194,26,.16)";g.fill();
  g.beginPath();D.pts.forEach((p,i)=>{i?g.lineTo(px(i),py(p.v)):g.moveTo(px(i),py(p.v));});g.strokeStyle=Y;g.lineWidth=10;g.lineJoin="round";g.lineCap="round";g.stroke();
  const lx=px(D.pts.length-1),ly=py(D.pts[D.pts.length-1].v);g.fillStyle=Y;g.beginPath();g.arc(lx,ly,20,0,Math.PI*2);g.fill();g.strokeStyle=BG;g.lineWidth=8;g.stroke();
  g.fillStyle=MUT;g.font="600 34px "+BF;g.fillText(fshort(D.first.d),cx,cy+ch+56);g.textAlign="right";g.fillText(fshort(D.last.d),cx+cw,cy+ch+56);g.textAlign="left";
  g.fillStyle=INK;g.font="600 40px "+BF;g.fillText("Última: "+D.last.reps.filter(r=>r>0).join("/")+" × "+fmt(D.last.w)+" kg",90,cy+ch+150);
  g.fillStyle=Y;g.fillRect(90,H-200,80,8);g.fillStyle=INK;g.font="800 64px "+DF;g.fillText("PLAN DE @SANTIARIASCOACH_",90,H-110);
  return await new Promise(r=>c.toBlob(b=>r(b),"image/png"));
}

/* ---------- Demo ---------- */
function buildDemo(){
  S=makeState(4,"hipertrofia","",{banca:60,remo:50,militar:37.5,sentadilla:80,rumano:70,muerto:100,hipthrust:80});
  const accW={jalon:45,laterales:8,triceps:20,inclinado:20,remopolea:45,curl:10,facepull:15,prensa:120,femoral:35,gemelos:60,zancadas:14,cuadriceps:40,pressmanc:24,bulgara:14,tricepsnuca:17.5,jalonneutro:50,curlmartillo:12,pressfrances:20,pajaros:6,lateralpolea:7.5};
  Object.keys(accW).forEach(id=>{if(S.ex[id]){S.ex[id].weight=accW[id];S.ex[id].status="start";S.ex[id].reason="Empieza en "+S.ex[id].repMin+" reps por serie.";}});
  SESS=[];
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};
  const start=Date.now()-34*864e5;
  for(let k=0;k<15;k++){
    const dayIdx=S.nextDay,items={};
    S.program[dayIdx].ex.forEach(id=>{const r=rx(id),e=S.ex[id];items[id]={w:r.w,reps:r.targets.map(t=>Math.max(e.repMin-1,Math.min(e.repMax,t+(rnd()<0.1?-1:Math.floor(rnd()*3))))),done:Array(r.sets).fill(true),rpe:[7,8,8,9,9,10][Math.floor(rnd()*6)]};});
    const d=new Date(start+k*2.2*864e5);d.setHours(19,30,0,0);
    const res=commitSession(dayIdx,items,d.toISOString(),50+Math.floor(rnd()*20));
    if(res){const q=()=>2+Math.floor(rnd()*4);const w={sleep:q(),energy:q(),doms:q(),stress:q(),mood:q()};w.score=wellScore(w);res.sess.well=w;res.sess.srpe=6+Math.floor(rnd()*4);res.sess.load=sessLoad(res.sess);}
  }
  S.settings.week=["gym","gym","descanso","gym","gym","opcional","descanso"];
  updMon();MODE="demo";draft=null;view="hoy";
}

    case"nav":view=v;planDirty=null;confirmReset=false;window.scrollTo(0,0);break;
    case"setup-days":setup.days=Number(v);break;
    case"setup-goal":setup.goal=v;break;
    case"create":{
      document.querySelectorAll("[data-setw]").forEach(inp=>{setup.w[inp.dataset.setw]=inp.value;});
      S=makeState(setup.days,setup.goal,setup.name,setup.w);SESS=[];draft=null;

      saveProfile();view="hoy";window.scrollTo(0,0);break;}
    case"demo":buildDemo();window.scrollTo(0,0);break;
    case"exit-demo":S=null;SESS=[];draft=null;MODE=profileRef?"db":"local";window.scrollTo(0,0);break;
    case"pick-day":{const n=Number(v);if(n!==draft.day){draft=freshDraft(n,draft.ready);saveDraft();}swapOpen=null;break;}
    case"ready":{const r=Object.assign({},draft.ready&&typeof draft.ready.sleep!=="string"?draft.ready:{});r[t.dataset.f]=Number(v);draft.ready=r;applyReady();saveDraft();break;}
    case"week-share":openWeekShare();return;
    case"week-save":if(weekBlob)shareFile(weekBlob,"semana-"+(sumWeek==="prev"?"pasada":"actual")+".png");return;
    case"vol-week":volWeek=v;break;
    case"sum-week":sumWeek=v;break;
    case"sum-open":S.sumSeen=weekStartMs()-7*DAY;saveProfile();sumWeek="prev";view="progreso";progTab="resumen";window.scrollTo(0,0);break;
    case"vol-add":case"vol-del":{const e=S.ex[id];if(!e)break;if(a==="vol-add"&&e.sets<6){e.sets++;e.bonus=(e.bonus||0)+1;e.targets=(e.targets||[]).concat([e.targets&&e.targets.length?e.targets[e.targets.length-1]:e.repMin]);}else if(a==="vol-del"&&e.sets>2){e.sets--;e.bonus=(e.bonus||0)-1;e.targets=(e.targets||[]).slice(0,e.sets);}if(draft&&!draftTouched(draft))applyReady();saveProfile();toast(LIB[id].name+": "+e.sets+" series a partir de ahora");break;}
    case"wk-pick":{const i=Number(t.dataset.i);
      if(wkPend){wkPend=null;wkMove=i;break;}
      if(wkMove==null){wkMove=i;break;}
      if(wkMove===i){wkMove=null;break;}
      const p=planWeek(),sw=wkSwap(p.days,wkMove,i),had=wkWarn(p.days),w=wkWarn(sw).filter(x=>!had.includes(x)),a=wkMove;
      if(w.length){wkPend={a,b:i,w};break;}
      wkApply(sw);toast(wkLbl(sw[i])+" pasa al "+WEEKDAYS[i].toLowerCase());break;}
    case"wk-ok":{if(!wkPend)break;const p=planWeek(),b=wkPend.b,sw=wkSwap(p.days,wkPend.a,b);wkApply(sw);toast(wkLbl(sw[b])+" pasa al "+WEEKDAYS[b].toLowerCase());break;}
    case"wk-cancel":wkMove=null;wkPend=null;break;
    case"wk-reset":S.weekOv=null;wkMove=null;wkPend=null;saveProfile();if(draft&&!draftTouched(draft)){draft=freshDraft(null,draft.ready);saveDraft();}toast("Semana restablecida");break;
    case"train-anyway":draft.anyway=true;saveDraft();break;
    case"rpe":{const n=Number(v);it.rpe=it.rpe===n?null:n;it.effort=null;it.adjDone=false;saveDraft();break;}
    case"rpe-adj":{const e=S.ex[id];it.w=v==="down"?roundW(e,it.w*0.95):Math.round(((it.w||0)+e.inc)*100)/100;it.adjDone=true;saveDraft();toast("Peso de las series que quedan: "+unitW(id,it.w));break;}
    case"srpe":{const s=SESS.find(x=>x.id===id);if(!s)break;s.srpe=Number(v);s.load=sessLoad(s);saveSession(s);updMon();saveProfile();const box=document.getElementById("borg-"+id);if(box&&!$("#modal").hidden&&$("#modal").contains(box)){box.outerHTML=srpeBox(s);return;}break;}
    case"soft-week":{S.softUntil=softWeekOn()?null:Date.now()+7*DAY;if(draft&&!draftTouched(draft))applyReady();saveProfile();toast(S.softUntil?"Semana de descarga activada: 7 días":"Semana de descarga desactivada");break;}
    case"swap-open":swapOpen=swapOpen===id?null:id;break;
    case"swap-keep":swapKeep=!swapKeep;break;
    case"swap":doSwap(id,v,swapKeep);break;
    case"foot":{const w=S.settings.week?S.settings.week.slice():Array(7).fill("libre");w[i]=v;S.settings.week=w;if(draft&&!draftTouched(draft))draft=null;saveProfile();break;}
    case"week-off":S.settings.week=null;if(draft&&!draftTouched(draft))draft=null;saveProfile();break;
    case"r-":it.reps[i]=Math.max(0,it.reps[i]-1);saveDraft();break;
    case"r+":it.reps[i]=Math.min(50,it.reps[i]+1);saveDraft();break;
    case"w-":case"w+":{const e=S.ex[id];const base=it.w==null?(LIB[id].equip==="barra"?S.settings.bar:0):it.w;it.w=Math.max(0,Math.round((base+(a==="w+"?1:-1))*100)/100);saveDraft();break;}
    case"done":{
      if(it.w==null){toast("Escribe primero el peso que vas a usar en "+LIB[id].name);$("#w-"+id)&&$("#w-"+id).focus();return;}
      it.done[i]=!it.done[i];saveDraft();if(focusOn)focusId=id;else actOpen=id;
      if(it.done[i]){setSound();checkLivePR(id,i);const last=it.done.every(Boolean);startRest(last?120:restFor(id),last?"cambio de ejercicio":LIB[id].name);}
      break;}
    case"effort":it.effort=it.effort===v?null:v;saveDraft();break;
    case"finish":{
      if(!confirmFinish){confirmFinish=true;render();setTimeout(()=>{if(confirmFinish){confirmFinish=false;render();}},4000);return;}
      confirmFinish=false;
      const mins=Math.max(1,Math.round((Date.now()-draft.started)/60000));
      const res=commitSession(draft.day,draft.items,new Date().toISOString(),mins,dayList(draft),readyLevel(draft));
      if(!res){toast("Marca al menos una serie con ✓ para guardar la sesión.");break;}
      res.sess.well=isWell(draft.ready)?Object.assign({},draft.ready,{score:wellScore(draft.ready)}):null;updMon();
      saveProfile();saveSession(res.sess);
      if(focusOn){focusOn=false;focusId=null;lockScreen(false);}
      draft=null;ls.del("lh-draft");clearInterval(timer.iv);$("#timer").hidden=true;
      showSummary(res);window.scrollTo(0,0);break;}
    case"discard":draft=freshDraft(draft.day,draft.ready);saveDraft();toast("Sesión reiniciada");break;
    case"close-modal":$("#modal").hidden=true;$("#modal").classList.remove("full");break;
    case"prog-ex":progEx=v;break;
    case"hist":openHist[v]=!openHist[v];break;
    case"t-add":timer.end+=30000;timer.total+=30000;tick();return;
    case"t-skip":clearInterval(timer.iv);timer.end=0;$("#timer").hidden=true;renderFocus();return;
    case"start":if(!isWell(draft.ready)&&!softWeekOn()&&!confirmNoWell){confirmNoWell=true;render();setTimeout(()=>{if(confirmNoWell){confirmNoWell=false;render();}},4000);return;}confirmNoWell=false;draft.active=true;draft.started=Date.now();saveDraft();actOpen=null;focusOn=true;focusId=null;lockScreen(true);window.scrollTo(0,0);break;
    case"pv-open":pvOpen=pvOpen===id?null:id;break;
    case"ex-open":actOpen=id;swapOpen=null;break;
    case"cancel":if(!confirmCancel){confirmCancel=true;render();setTimeout(()=>{if(confirmCancel){confirmCancel=false;render();}},4000);return;}confirmCancel=false;draft=freshDraft(draft.day,draft.ready);saveDraft();focusOn=false;lockScreen(false);clearInterval(timer.iv);$("#timer").hidden=true;toast("Entrenamiento cancelado");window.scrollTo(0,0);break;
    case"f-open":focusOn=true;focusId=null;lockScreen(true);break;
    case"f-close":focusOn=false;focusId=null;lockScreen(false);break;
    case"f-prev":case"f-next":{const list=dayList(draft),k=list.indexOf(curFocusId())+(a==="f-next"?1:-1);if(k>=0&&k<list.length)focusId=list[k];break;}
    case"map-view":mapView=v;break;
    case"prog-tab":progTab=v;window.scrollTo(0,0);break;
    case"photo-del":delete S.settings.photo;delete S.settings.photoCut;saveProfile();toast("Foto quitada");break;
    case"radar-view":radarView=v;break;
    case"sess-share":openSessionShare();return;
    case"sess-save":if(sessBlob&&lastRes)shareFile(sessBlob,"sesion-"+lastRes.sess.id+".png");return;
    case"goal-add":{const ex=$("#goal-ex").value,tg=parseNum($("#goal-t").value);goalForm={ex,t:$("#goal-t").value};
      if(!tg||tg<=0){toast("Escribe el peso objetivo en kg.");return;}
      S.goals=(S.goals||[]).concat([{id:"g"+Date.now(),ex,target:tg}]);goalForm={ex,t:""};saveProfile();toast("Objetivo añadido");break;}
    case"goal-del":S.goals=(S.goals||[]).filter(g=>g.id!==v);saveProfile();break;
    case"pd-days":planDirty=Object.assign({days:S.settings.days,goal:S.settings.goal},planDirty||{},{days:Number(v)});break;
    case"pd-goal":planDirty=Object.assign({days:S.settings.days,goal:S.settings.goal},planDirty||{},{goal:v});break;
    case"pd-apply":{
      const old=S,ns=makeState(planDirty.days,planDirty.goal,old.settings.name,null);
      Object.keys(ns.ex).forEach(k=>{const o=old.ex[k];if(o){Object.assign(ns.ex[k],{weight:o.weight,inc:o.inc,last:o.last,fails:0});if(o.weight!=null){ns.ex[k].status="start";ns.ex[k].reason="Nuevo rango: empieza en "+ns.ex[k].repMin+" reps por serie.";}}});
      ns.settings=Object.assign({},old.settings,{days:planDirty.days,goal:planDirty.goal});
      ns.sessionsDone=old.sessionsDone;ns.prs=old.prs||0;ns.nextDay=0;ns.goals=old.goals||[];ns.block=old.block||1;
      S=ns;planDirty=null;draft=null;ls.del("lh-draft");saveProfile();toast("Rutina actualizada");break;}
    case"recheck":try{await loadMine();}catch(e){}if(!S)toast("Todavía no tienes rutina asignada.");break;
    case"retry":boot();return;
    case"logout":await sb.auth.signOut();S=null;SESS=[];draft=null;ls.del("lh-draft");UID=null;ROLE="player";view="hoy";focusOn=false;MODE="auth";authMsg="";authMode="login";break;
    case"auth-toggle":authMode=authMode==="signup"?"login":"signup";authMsg="";break;
    case"auth-forgot":{const em=($("#au-email")&&$("#au-email").value.trim())||authEmail;if(!em){authMsg="Escribe tu correo arriba y vuelve a tocar «He olvidado mi contraseña».";break;}authEmail=em;const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});authMsg=r.error?AUTH_ERR(r.error.message):"Te hemos enviado un correo para cambiar la contraseña.";break;}
    case"reload-team":await loadPlayers();toast("Equipo actualizado");break;
    case"match":{const n=Number(v);teamCfg={matchDay:n<0?null:n};const r=await sb.from("team_config").update({match_day:teamCfg.matchDay,updated_at:new Date().toISOString()}).eq("id",1);toast(r.error?"No se pudo guardar el día de partido.":"Día de partido guardado");break;}
    case"as-days":assignDraft[id]=Object.assign({days:2,goal:"mixto"},assignDraft[id]||{},{days:Number(v)});break;
    case"as-goal":assignDraft[id]=Object.assign({days:2,goal:"mixto"},assignDraft[id]||{},{goal:v});break;
    case"assign":{const pl=PLAYERS.find(x=>x.id===id),ad=assignDraft[id]||{days:(pl.assign&&pl.assign.days)||2,goal:(pl.assign&&pl.assign.goal)||"mixto"};
      const asg={days:ad.days,goal:ad.goal,ts:Date.now()};
      const r=await sb.from("assignments").upsert({user_id:id,days:asg.days,goal:asg.goal,ts:asg.ts,updated_at:new Date().toISOString()});
      if(r.error)toast("No se pudo asignar la rutina.");else{pl.assign=asg;toast("Rutina enviada a "+pname(id)+". La verá al abrir la app.");}break;}
    case"p-open":{if(openPlayer===id){openPlayer=null;break;}openPlayer=id;render();
      if(!playerSess[id]){const r=await sb.from("sessions").select("data").eq("user_id",id).order("date",{ascending:true});playerSess[id]=r.error?[]:r.data.map(x=>x.data);}
      break;}
    case"pd-blocks":S.settings.autoBlocks=v==="1";draft=null;ls.del("lh-draft");saveProfile();break;
    case"story":openStory(v);return;
    case"story-save":saveStory();return;
    case"story-reel":reelScript();return;
    case"pd-deload":S.settings.deloadEvery=Number(v);draft=null;ls.del("lh-draft");saveProfile();break;
    case"reset":confirmReset=true;break;
    case"reset-no":confirmReset=false;break;
    case"reset-yes":confirmReset=false;if(MODE==="demo"){S=null;SESS=[];MODE=profileRef?"db":"local";}else await wipeAll();view="hoy";break;
    default:return;
  }
  render();
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.w&&draft){const id=t.dataset.w;draft.items[id].w=parseNum(t.value);saveDraft();render();}
  else if(t.dataset.pw){const e=S.ex[t.dataset.pw],n=parseNum(t.value);e.weight=n;if(n!=null&&e.status==="new"){e.status="start";e.reason="Empieza en "+e.repMin+" reps por serie.";}draft=null;ls.del("lh-draft");saveProfile();render();}
  else if(t.dataset.pi){const n=parseNum(t.value);if(n&&n>0){S.ex[t.dataset.pi].inc=n;saveProfile();}render();}
  else if(t.dataset.photo&&t.files&&t.files[0]){loadPhoto(t.files[0]);}
  else if(t.dataset.bw){const n=parseNum(t.value);S.settings.bw=n&&n>30&&n<250?n:null;saveProfile();render();}
  else if(t.dataset.ht){let n=parseNum(t.value);if(n&&n<3)n=n*100;S.settings.height=n&&n>120&&n<230?Math.round(n):null;saveProfile();render();}
  else if(t.dataset.bar){const n=parseNum(t.value);if(n!=null&&n>=0){S.settings.bar=n;saveProfile();}render();}
  else if(t.dataset.setw){setup.w[t.dataset.setw]=t.value;}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&focusOn){focusOn=false;focusId=null;lockScreen(false);render();return;}if(ev.key==="Escape"&&!$("#modal").hidden){$("#modal").hidden=true;$("#modal").classList.remove("full");}});
boot().then(()=>{initVoice();initCoach();initDownloads();});
})();
</script>
